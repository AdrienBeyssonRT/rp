[reverse_proxy]
# Remplacez par l'IP ou hostname de votre serveur
# Pour déploiement local, utilisez 'localhost' ou '127.0.0.1'
localhost ansible_connection=local

# Exemple pour déploiement distant :
# 192.168.200.20 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[reverse_proxy:vars]
# Variables communes pour le groupe reverse_proxy
backend_server=192.168.200.20
backend_port=80
domain_name=monsite.local  # Nom local gratuit (déjà configuré)

